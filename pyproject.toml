[project]
name = "paintbot"
version = "0.1.0"
description = "Simulator-agnostic core for a language-conditioned robotic spray-painting system"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["paintbot"]
